<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Germany Map</title>

    <!-- Leaflet CSS (required) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .map-popup img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 5px;
            margin-top: 5px;
        }
        .map-popup h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .map-popup p {
            margin: 0;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS (required) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Create the map centered on Germany
        const map = L.map('map').setView([51.1657, 10.4515], 6);

        // Background tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Your list of pins and details
        const locations = [
            {
                name: "Berlin Brandenburger Tor",
                lat: 52.5163,
                lng: 13.3777,
                description: "The iconic 18th-century neoclassical monument in Berlin.",
                image: "images/pic1.jpg"
            },
            {
                name: "Cologne Cathedral",
                lat: 50.9413,
                lng: 6.9583,
                description: "The famous twin-spired Gothic cathedral in Cologne.",
                image: "images/pic2.jpg"
            },
            {
                name: "Munich Marienplatz",
                lat: 48.1351,
                lng: 11.5820,
                description: "The central square in the city center of Munich since 1158.",
                image: "images/pic3.jpg"
            }
        ];

        // Add markers and bind popups (HTML allowed)
        locations.forEach(place => {
            const popupContent = `
                <div class="map-popup">
                    <h3>${place.name}</h3>
                    <p>${place.description}</p>
                    <img src="${place.image}" alt="${place.name}">
                </div>
            `;

            const marker = L.marker([place.lat, place.lng]).addTo(map);

            // Use a popup so the image and HTML render correctly
            marker.bindPopup(popupContent, { maxWidth: 260 });

            // Optional: open popup on hover and close on mouseout
            marker.on('mouseover', function () { this.openPopup(); });
            marker.on('mouseout', function () { this.closePopup(); });
        });
    </script>

</body>
</html>
