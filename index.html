<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Germany Map</title>

    <!-- Leaflet CSS (required) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .map-popup img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 5px;
            margin-top: 5px;
        }
        .map-popup h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .map-popup p {
            margin: 0;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS (required) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Create the map centered on Germany
        const map = L.map('map').setView([51.1657, 10.4515], 6);

        // Background tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Your list of pins and details
        const locations = [
            {
                name: "Abdulkadir Ö.    -    18. August 2026",
                lat: 48.1611,
                lng: 11.5689,
                description: "14 Jahre alt. Angeschossen durch die Polizei aufgrund einer Spielzeugpistole. Status: Verletzt Verhandlung: Vorverhandlung",
                image: "images/pic5.jpg"
            },
            {
                name: "N.N.    -    19. Juli 2026",
                lat: 51.433438,
                lng: 6.766144,
                description: "37 Jahre alt. Verlor das Bewusstsein nach Fixierung durch die Beamten. Status: Verstorben, infolge des Einsatzes Verhandlung: Vorverhandlung",
                image: "images/Platzhalterbild_Mann.jpg"
            },
            {
                name: "Pedro C.    -    08. April 2026",
                lat: 50.942572,
                lng: 6.958977,
                description: "30 Jahre alt. Koma infolge einer Fixierung mit Spuckhaube und Beruhigungsmittel im Rahmen eines von einer Notärztin angeforderten Polizeieinsatzes auf Grund einer psychischen Ausnahmesituation [...]", 
                image: "images/Pedro.C.jpg"
            },
            {
                name: "Lorenz A.    -    20. April 2026",
                lat: 53.1439,
                lng: 8.2139,
                description: "21 Jahre alt. Mit fünf Schüssen von hinten von Polizisten erschossen, nachdem er nach einer Auseinandersetzung vor einem Club flüchtete. Laut Staatsanwaltschaft bestehen [...]", 
                image: "images/Lorenz.A.jpg"
            },
            {
                name: "Ibrahima Barry    -    6. Januar 2024",
                lat: 51.424,
                lng: 6.876,
                description: "26 Jahre alt. Verstorben an einem \"Kombinationsgeschehen\" aus einem langlebigen Erstickungstod und kurzfristigem Herzinfarkt, nach einer unverhältnismäßigen Fixierung [...]", 
                image: "images/Ibrahima.Barry.jpg"
            },
            {
                name: "Martin Bialluch    -    7. Juni 2026",
                lat: 52.5158,
                lng: 13.4542,
                description: "57 Jahre alt. Der ehemalige Pressesprecher der Linkspartei wurde nach einer Auseinandersetzung, nachdem er und seine Gruppe nach einem Straßenfest nach dem Grund einer Straftat gesucht wurden, [...]", 
                image: "images/MartinB.jpg"    
            },
            {
                name: "N.N.    -    5. April 2026",
                lat: 49.233334,
                lng: 7.000000,
                description: "22 Jahre alt. Erschossen als er vor einer Verkehrskontrolle flüchtete. Fuhr nach Aussagen in eine Sackgasse und blieb beim rückwärts ausfahren zwischen Polizeiautos klemmend [...]", 
                image: "images/Platzhalterbild_Mann.jpg"
            },
            {
                name: "N.N.    -    17. November 2025",
                lat: 51.481,
                lng: 7.216,
                description: "12 Jahre alt. Die Polizei soll ein gehörloses Mädchen finden, ihr ihre überlebenswichtigen Medikamente geben, und zurück in die Einrichtung in der sie untergebracht ist bringen. Beschwerden über Behandlung [...]", 
                image: "images/Platzhalterbild_Frau.jpg"
            },
            {
                name: "Mehrere Kinder einer Schulklasse    -    Juni 2024",
                lat: 53.5511,
                lng: 9.9937,
                description: "Mehrere Kinder einer vierten Schulklasse berichten nach einer Verkehrsschulung, dass die Polizistin Verena B. sie angeschrien, beleidigt, geschlagen und einen Jungen sogar [...]", 
                image: "images/Platzhalterbild_Mann.jpg"
            },
            {
                name: "N.N. & N.N.    -    Karneval 2023",
                lat: 50.5711,
                lng: 10.4190,
                description: "Ein Polizist schlägt nach Pöbeleien zweier betrunkener Karnevalgänger deren Köpfe auf den Boden und gegen eine Wand. Status: Genesen Verhandlung: Abgeschlossen, Urteil [...]", 
                image: "images/Platzhalterbild_Mann.jpg"
            },
            {
                name: "N.N.    -    24. April 2026",
                lat: 53.6509,
                lng: 9.8339,
                description: "17 Jahre alt. Schulterschuss nachdem er vor einer Festnahme flüchten wollte. Status: Genesen Verhandlung: Vorverhandlung",
                image: "images/Platzhalterbild_Mann.jpg"
            }
        ];

        // Add markers and bind popups (HTML allowed)
        locations.forEach(place => {
            const popupContent = `
                <div class="map-popup">
                    <h3>${place.name}</h3>
                    <p>${place.description}</p>
                    <img src="${place.image}" alt="${place.name}">
                </div>
            `;

            const marker = L.marker([place.lat, place.lng]).addTo(map);

            // Use a popup so the image and HTML render correctly
            marker.bindPopup(popupContent, { maxWidth: 260 });

            // Optional: open popup on hover and close on mouseout
            marker.on('mouseover', function () { this.openPopup(); });
            marker.on('mouseout', function () { this.closePopup(); });
        });
    </script>

</body>
</html>
